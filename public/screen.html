<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>签到大屏</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/screen.css"></head><body class="screen-body"><main class="screen-shell" id="screenShell"><div class="screen-controls"><span id="status">连接中…</span><button id="fullBtn" type="button">全屏播放</button></div><div class="stage" id="stage"><img class="board-art" src="/assets/board-preview.png" alt="漫画平涂版签到板背景"><div id="overlay" class="overlay"></div></div></main><script>
const $=id=>document.getElementById(id);let lastCount=0;
function render(s,animate=false){document.title=s.eventName;const by=Object.fromEntries(s.departments.map(d=>[d.id,{...d,n:[]} ]));s.checkins.forEach(x=>by[x.department]?.n.push(x));$('overlay').innerHTML=s.departments.map(d=>{const names=by[d.id].n;return `<section class="panel panel-${d.id}"><div class="count">${names.length}<small>人</small></div><div class="names">${names.map(x=>`<span class="name">${esc(x.name)}</span>`).join('')||'<span class="placeholder">等待签到…</span>'}</div></section>`}).join('');if(animate||s.checkins.length>lastCount){$('stage').classList.remove('arrival');void $('stage').offsetWidth;$('stage').classList.add('arrival');}lastCount=s.checkins.length}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function enterFullscreen(){const el=$('screenShell');if(!document.fullscreenElement){await el.requestFullscreen?.()}else await document.exitFullscreen?.()}
function connect(){const es=new EventSource('/api/events');es.onopen=()=>$('status').textContent='实时连接';es.onerror=()=>$('status').textContent='连接恢复中…';for(const type of ['snapshot','checkin','state'])es.addEventListener(type,e=>render(JSON.parse(e.data),type==='checkin'))}
$('fullBtn').onclick=enterFullscreen;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')enterFullscreen();if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});document.addEventListener('fullscreenchange',()=>{$('fullBtn').textContent=document.fullscreenElement?'退出全屏':'全屏播放'});fetch('/api/config').then(r=>r.json()).then(s=>{render(s);connect()});
</script></body></html>
