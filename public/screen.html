<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>签到大屏</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="bar"><div><p class="sub">北京邮电大学学生会</p><h1 id="event">活动签到</h1></div><div id="status">连接中…</div></div><div id="grid" class="grid"></div></main><script>let cfg;function render(s){cfg=s;document.title=s.eventName;document.getElementById('event').textContent=s.eventName;let by=Object.fromEntries(s.departments.map(d=>[d.id,{...d,n:[]} ]));s.checkins.forEach(x=>by[x.department]?.n.push(x));document.getElementById('grid').innerHTML=s.departments.map(d=>`<section class="dept"><h2>${d.name} <small>${by[d.id].n.length}人</small></h2><div class="names">${by[d.id].n.map(x=>`<span class="name">${x.name}</span>`).join('')}</div></section>`).join('')}async function init(){render(await fetch('/api/config').then(r=>r.json()));connect()}function connect(){let es=new EventSource('/api/events');es.onopen=()=>document.getElementById('status').textContent='实时连接';es.onmessage=e=>render(JSON.parse(e.data));es.addEventListener('snapshot',e=>render(JSON.parse(e.data)));es.addEventListener('checkin',e=>render(JSON.parse(e.data)));es.addEventListener('state',e=>render(JSON.parse(e.data)));es.onerror=()=>document.getElementById('status').textContent='连接恢复中…'}init()</script></body></html>
