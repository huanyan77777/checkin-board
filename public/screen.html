<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大会签到 · 实时大屏</title><link rel="stylesheet" href="/screen.css">
<script src="/screen.js" defer></script>
</head>
<body>
<div id="screenShell">
  <nav class="controls" aria-label="播放控制">
    <span id="connection" role="status">正在连接…</span>
    <button id="fullBtn">全屏播放 · F</button>
    <button id="hideBtn">隐藏控制栏 · H</button>
  </nav>
  <main id="stage" class="stage">
    <div class="decoration disc"></div><div class="decoration arc"></div>
    <header class="masthead">
      <img class="logo" src="/assets/logo.png" alt="北京邮电大学校徽">
      <div><p class="eyebrow">2026年北京邮电大学学生会</p>
        <h1>全体工作人员及骨干志愿者大会</h1>
        <div class="title-bars"><i></i><i></i></div>
      </div>
      <div class="total"><span>已签到</span><strong id="total">0</strong><span>人</span></div>
    </header>
    <section class="section-heading"><h2>点亮你的部门</h2><p>扫码签到，留下名字，让每一份热爱汇聚于此。</p><span id="eventState">加载中</span></section>
    <div id="grid" class="grid" aria-label="六部门签到区域"></div>
    <footer><span>北京邮电大学学生会</span><span id="footerHint">姓名泡按所选颜色点亮 · 未签到区域保持暗色</span><span class="dots">● ● ● ●</span></footer>
  </main>
</div>
</body></html>
