<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>点亮你的部门 · 大会签到</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/join.css"><script src="/join.js" defer></script></head>
<body class="join-page"><main>
<p class="sub">2026年北京邮电大学学生会</p><h1>点亮你的部门</h1>
<p class="intro">全体工作人员及骨干志愿者大会</p>
<section class="card"><p>留下名字，选一个喜欢的颜色。签到成功后，你的文字泡将点亮现场大屏的一小块区域。</p>
<form id="form">
<label for="name">姓名</label><input id="name" maxlength="30" required autocomplete="name" placeholder="请输入真实姓名">
<label for="department">所在部门</label><select id="department" required><option value="">请选择部门</option></select>
<fieldset><legend>喜欢的文字泡颜色</legend><div id="colors" class="color-options"></div></fieldset>
<div class="bubble-preview"><span id="preview">你的名字</span></div>
<p class="privacy">提交即表示知悉：姓名与所选颜色将展示在现场大屏，请勿填写其他隐私信息。</p>
<button id="submit" disabled>加载签到状态…</button><p id="msg" role="status" aria-live="polite"></p>
</form></section><p class="sub bottom-note">北京邮电大学学生会 · 欢迎你的到来</p>
</main></body></html>
