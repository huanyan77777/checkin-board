<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动签到</title><link rel="stylesheet" href="/style.css"></head><body><main><p class="sub">北京邮电大学学生会</p><h1 id="event">活动签到</h1><section class="card"><p>签到后姓名会显示在现场大屏对应部门下方。</p><form id="form"><label>姓名<input id="name" maxlength="30" required autocomplete="name" placeholder="请输入真实姓名"></label><label>部门<select id="department" required><option value="">请选择部门</option></select></label><button id="submit">确认签到</button><p id="msg" role="status"></p></form></section></main><script>const $=id=>document.getElementById(id);let cfg;async function init(){cfg=await fetch('/api/config').then(r=>r.json());$('event').textContent=cfg.eventName;cfg.departments.forEach(d=>{let o=document.createElement('option');o.value=d.id;o.textContent=d.name;$('department').append(o)});if(!cfg.open){$('msg').textContent='签到暂未开放';$('submit').disabled=true}}$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').className='';$('msg').textContent='提交中…';try{let r=await fetch('/api/checkins',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value,department:$('department').value})});let d=await r.json();if(!r.ok)throw Error(d.error);$('msg').className='ok';$('msg').textContent=d.duplicate?'你已经签到过了':'签到成功，请看大屏';$('form').reset()}catch(e){$('msg').className='err';$('msg').textContent=e.message||'提交失败，请重试'}finally{$('submit').disabled=false}};init()</script></body></html>
