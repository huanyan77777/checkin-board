<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>签到控制台</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="bar"><h1>签到控制台</h1><a href="/screen">打开大屏</a></div><section class="card"><label>管理员令牌<input id="token" type="password" placeholder="输入 ADMIN_TOKEN"></label><div class="bar"><button onclick="change('open')">开放签到</button><button onclick="change('close')">关闭签到</button><button onclick="downloadCsv()">导出 CSV</button></div><p id="msg" role="status"></p></section><section class="card"><h2>名单导入</h2><p class="sub">CSV 第一行必须是 <code>name,department,required</code>；department 使用 learning、office、arts、sports、publicity、rights。</p><input id="csv" type="file" accept=".csv,text/csv"><button onclick="importRoster()">导入名单并替换现有名单</button></section><section class="card"><h2>当前签到</h2><p id="summary"></p><div id="list"></div></section></main><script>const $=id=>document.getElementById(id);let s;const headers=()=>({authorization:'Bearer '+$('token').value});async function load(){s=await fetch('/api/config').then(r=>r.json());render()}function render(){const names=s.checkins;const done=new Set(names.map(x=>x.department));$('summary').textContent=`状态：${s.open?'开放':'关闭'} · 已签到 ${names.length} 人 · ${done.size}/6 个部门有签到`;$('list').innerHTML=names.map(x=>`<p>${esc(x.name)} · ${s.departments.find(d=>d.id===x.department)?.name||x.department} <button style="width:auto;padding:5px 8px;margin:0 0 0 8px" onclick="remove('${x.id}')">撤销</button></p>`).join('')||'暂无签到'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function change(action){let r=await fetch('/api/admin/'+action,{method:'POST',headers:headers()});let d=await r.json();$('msg').textContent=r.ok?'操作成功':d.error;if(r.ok){s=d;render()}}async function remove(id){if(!confirm('确认撤销这条签到？'))return;let r=await fetch('/api/admin/checkins/'+id,{method:'DELETE',headers:headers()});let d=await r.json();$('msg').textContent=r.ok?'已撤销':d.error;if(r.ok){s=d;render()}}async function downloadCsv(){const r=await fetch('/api/admin/export.csv',{headers:headers()});if(!r.ok)return $('msg').textContent=(await r.json()).error;const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='checkins.csv';a.click()}async function importRoster(){const f=$('csv').files[0];if(!f)return $('msg').textContent='请选择 CSV';const lines=(await f.text()).split(/\r?\n/).filter(Boolean);const rows=lines.slice(1).map(line=>{const a=line.split(',').map(x=>x.trim());return{name:a[0],department:a[1],required:a[2]!=='0'}});const r=await fetch('/api/admin/roster',{method:'POST',headers:{...headers(),'content-type':'application/json'},body:JSON.stringify({rows})});const d=await r.json();$('msg').textContent=r.ok?'名单导入成功':d.error;if(r.ok){s=d;render()}}load()</script></body></html>
