<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-labelledby="learning-title learning-desc">
<title id="learning-title">学习部签到完成</title>
<desc id="learning-desc">姓名泡汇入打开的书本，书页翻动，金色星星与完成徽章依次亮起。</desc>
<g stroke="#17366F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <ellipse cx="320" cy="339" rx="175" ry="13" fill="#203971" opacity=".08" stroke="none"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 28;0 -5;0 0" dur=".65s" fill="freeze"/>
    <!-- Blue cover and stacked page edges. -->
    <path d="M135 159 Q228 133 320 177 Q412 133 505 159 L514 307 Q412 278 320 326 Q228 278 126 307Z" fill="#0865FF"/>
    <path d="M145 154 Q232 135 320 174 Q408 135 495 154 V292 Q405 269 320 312 Q235 269 145 292Z" fill="#BBD5FF"/>
    <path d="M155 135 Q238 119 320 160 Q402 119 485 135 V278 Q404 254 320 298 Q236 254 155 278Z" fill="#FFFDF7"/>
    <path d="M320 160 V298" fill="none"/>
    <g stroke="#A5BFFF" stroke-width="7" fill="none">
      <path d="M182 173 Q237 165 288 190 M182 202 Q237 194 288 219 M182 231 Q231 224 270 242"/>
      <path d="M352 190 Q403 165 458 173 M352 219 Q403 194 458 202 M370 242 Q409 224 458 231"/>
    </g>
    <!-- A sheet rises from the right, crosses the spine, and settles on the left. -->
    <path d="M320 160 Q402 119 485 135 V278 Q404 254 320 298Z" fill="#FFFDF7" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" begin="2.35s" dur="1.5s" fill="freeze"/>
      <animate attributeName="d" values="M320 160 Q402 119 485 135 V278 Q404 254 320 298Z;M320 160 Q365 65 387 74 L383 229 Q351 250 320 298Z;M320 160 Q274 65 253 74 L257 229 Q289 250 320 298Z;M320 160 Q238 119 155 135 V278 Q236 254 320 298Z" keyTimes="0;.35;.65;1" begin="2.35s" dur="1.5s" fill="freeze"/>
    </path>
    <path d="M363 276 V320 L379 310 L395 320 V266" fill="#FF8173" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur=".35s" fill="freeze"/>
    </path>
  </g>
  <!-- Actual names are substituted by the screen; these are standalone placeholders. -->
  <g data-name-bubble="1" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.7;1" begin=".5s" dur="1.6s" fill="freeze"/>
    <animateMotion path="M110 90 Q210 25 280 235" begin=".5s" dur="1.6s" fill="freeze"/>
    <g><animateTransform attributeName="transform" type="scale" values="1;1;.2" keyTimes="0;.35;1" begin=".5s" dur="1.6s" fill="freeze"/><rect x="-47" y="-23" width="94" height="46" rx="13" fill="#BBD5FF" stroke-width="3"/><text y="7" text-anchor="middle" font-size="21" font-weight="700" fill="#17366F" stroke="none">小林</text></g>
  </g>
  <g data-name-bubble="2" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.7;1" begin=".8s" dur="1.6s" fill="freeze"/>
    <animateMotion path="M530 85 Q420 20 360 235" begin=".8s" dur="1.6s" fill="freeze"/>
    <g><animateTransform attributeName="transform" type="scale" values="1;1;.2" keyTimes="0;.35;1" begin=".8s" dur="1.6s" fill="freeze"/><rect x="-47" y="-23" width="94" height="46" rx="13" fill="#FFD0C8" stroke-width="3"/><text y="7" text-anchor="middle" font-size="21" font-weight="700" fill="#17366F" stroke="none">小陈</text></g>
  </g>
  <g data-name-bubble="3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.7;1" begin="1.1s" dur="1.6s" fill="freeze"/>
    <animateMotion path="M95 215 Q165 80 280 235" begin="1.1s" dur="1.6s" fill="freeze"/>
    <g><animateTransform attributeName="transform" type="scale" values="1;1;.2" keyTimes="0;.35;1" begin="1.1s" dur="1.6s" fill="freeze"/><rect x="-47" y="-23" width="94" height="46" rx="13" fill="#ADE6CF" stroke-width="3"/><text y="7" text-anchor="middle" font-size="21" font-weight="700" fill="#17366F" stroke="none">小周</text></g>
  </g>
  <g data-name-bubble="4" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.7;1" begin="1.4s" dur="1.6s" fill="freeze"/>
    <animateMotion path="M545 205 Q475 80 360 235" begin="1.4s" dur="1.6s" fill="freeze"/>
    <g><animateTransform attributeName="transform" type="scale" values="1;1;.2" keyTimes="0;.35;1" begin="1.4s" dur="1.6s" fill="freeze"/><rect x="-47" y="-23" width="94" height="46" rx="13" fill="#D9C8FA" stroke-width="3"/><text y="7" text-anchor="middle" font-size="21" font-weight="700" fill="#17366F" stroke="none">小许</text></g>
  </g>
  <g transform="translate(320 90)"><g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.65s" dur=".3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values=".1;1.15;1" begin="3.65s" dur=".65s" fill="freeze"/>
    <path d="M0 -39 L12 -13 L41 -9 L20 11 L25 40 L0 26 L-25 40 L-20 11 L-41 -9 L-12 -13Z" fill="#FFD528"/>
    <path d="M-18 -10 L-8 -12 L-3 -24" stroke="#FFF6BA" stroke-width="4" fill="none"/>
  </g></g>
  <g fill="none" stroke="#EBAD32" opacity="0">
    <animate attributeName="opacity" values="0;1;0" begin="3.8s" dur="1.4s" fill="freeze"/>
    <path d="M250 80 L237 72 M390 80 L403 72 M320 32 V22 M250 120 L239 128 M390 120 L401 128"/>
  </g>
  <g transform="translate(485 292)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur=".4s" fill="freeze"/>
    <circle r="32" fill="#75D8B0"/>
    <path d="M-14 0 L-3 11 L16 -12" fill="none" stroke-width="6"/>
  </g>
</g>
</svg>
