<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办公室完成动画 · 独立预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#203971;font-family:"Microsoft YaHei",system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 26px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;margin:8px 0}p{font-size:14px;color:#71809a;line-height:1.7}.tag{font-size:12px;letter-spacing:2px;color:#b27c10}.stage{margin:24px 0;background:radial-gradient(ellipse at center,#fff6d7,transparent 65%),#fffdf8;border:1px solid #eee6d4;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px #20397108}object{width:100%;display:block;aspect-ratio:960/620;pointer-events:none}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,a{border:0;border-radius:9px;background:#203971;color:white;padding:11px 18px;text-decoration:none;font:inherit;font-size:14px;cursor:pointer}button.secondary,a{background:#eee9db;color:#203971}input[type=range]{flex:1;min-width:150px;accent-color:#315cf4}label{font-size:14px}#time{font-variant-numeric:tabular-nums;font-size:14px}footer{margin-top:18px}.stage:fullscreen{display:grid;place-items:center;background:#fff9ef}.stage:fullscreen object{height:100vh;width:auto;max-width:100vw}@media(max-width:600px){header{align-items:start;flex-direction:column}main{padding:20px 14px}h1{font-size:23px}}
</style><script src="/office-preview.js" defer></script></head>
<body><main><header><div><span class="tag">OFFICE / MOTION STUDY 01</span><h1>把每一份到场，收进同一封信</h1><p>办公室完成动画 · 独立样片，不连接签到数据</p></div><button id="fullscreen" class="secondary">全屏查看</button></header>
<section class="stage" id="stage"><object id="animation" type="image/svg+xml" data="/animations/office-complete.svg" aria-label="办公室完成动画">你的浏览器暂不支持 SVG 动画。</object></section>
<div class="controls"><button id="replay">重新播放</button><button id="pause" class="secondary">暂停</button><input id="seek" aria-label="动画进度" type="range" min="0" max="6.2" step="0.01" value="0"><span id="time">0.0 / 6.2 s</span><label><input id="loop" type="checkbox" checked> 循环预览</label><a href="/animations/office-complete.svg" target="_blank" rel="noopener">打开 SVG</a></div>
<footer><p>姓名为演示占位。0–3秒：姓名泡汇入信封；3–4秒：封口合拢，齿轮出现；4–6秒：齿轮转动，完成标记定格。可拖动进度逐帧查看。</p><p id="notice" role="status">仅制作办公室，尚未接入正式大屏或控制台。</p></footer>
</main></body></html>
